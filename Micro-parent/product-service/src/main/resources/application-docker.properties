# --------------------------------------------------------------------------
# Docker-profile overrides for product-service
# --------------------------------------------------------------------------

# Eureka: container name instead of localhost
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# Zipkin: container name + real internal port (9411, not host-mapped 19411)
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans

# Mongo: correct property name (spring.data.mongodb.uri, not spring.mongodb.uri)
# and container name instead of localhost
spring.mongodb.uri=mongodb://mongo:27017/product-service-db