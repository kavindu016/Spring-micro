  #     - prometheus:prometheus
  #   volumes:
  #     - ./grafana:/var/lib/grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=password

volumes:
  mongo-data:
  mysql-inventory-data:
  mysql-order-data:
  mysql-keycloak-data: