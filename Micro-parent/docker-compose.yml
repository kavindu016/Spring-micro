version: '3.7'
services:
  ## Mongo Docker Compose Config - product
  mongo:
    container_name: mongo
    image: mongo:4.4.18
    restart: always
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  ## MySQL for Inventory-Service
  mysql-inventory:
    container_name: mysql-inventory
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Kavindu@2000
      MYSQL_DATABASE: inventory_service
    volumes:
      - mysql-inventory-data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pKavindu@2000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ## MySQL for Order-Service
  mysql-order:
    container_name: mysql-order
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Kavindu@2000
      MYSQL_DATABASE: order_service
    volumes:
      - mysql-order-data:/var/lib/mysql
    ports:
      - "3308:3306"
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pKavindu@2000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ## Keycloak Config with MySQL database
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:5.7
    volumes:
      - mysql-keycloak-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    ports:
      - "3309:3306"   # fixed: container listens on 3306, not 3309
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:18.0.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 1234
    ports:
      - "8080:8080"
    volumes:
      - ./realms/:/opt/keycloak/data/import/
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  ## Zipkin
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "19411:9411"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  ## Eureka Server
  discovery-server:
    image: kavindu20/discovery-server:latest
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - zipkin
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api-gateway:
    image: kavindu20/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8181:9090"
    expose:
      - "9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=TRACE
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      - zipkin
      - discovery-server
      - keycloak
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  product-service:
    container_name: product-service
    image: kavindu20/product-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      - mongo
      - discovery-server
      - api-gateway
      - zipkin
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  order-service:
    container_name: order-service
    image: kavindu20/order-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql-order:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
      discovery-server:
        condition: service_started
      api-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  inventory-service:
    container_name: inventory-service
    image: kavindu20/inventory-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql-inventory:
        condition: service_healthy
      discovery-server:
        condition: service_started
      api-gateway:
        condition: service_started
      zipkin:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  notification-service:
    container_name: notification-service
    image: kavindu20/notification-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      - zipkin
      - kafka
      - discovery-server
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  ## Prometheus (disabled for now — uncomment to re-enable)
  # prometheus:
  #   image: prom/prometheus:v2.37.1
  #   container_name: prometheus
  #   restart: always
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
