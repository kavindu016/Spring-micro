eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.application.name=notification-service
server.port=0

# Zipkin endpoint
management.tracing.export.zipkin.endpoint=http://localhost:19411/api/v2/spans

# Sample 100% of requests
management.tracing.sampling.probability=1.0

# Show trace and span IDs in logs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Kafka Properties - Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.example.parent.OrderPlaceEvent