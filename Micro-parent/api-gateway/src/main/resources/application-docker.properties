# --------------------------------------------------------------------------
# Docker-profile overrides for api-gateway
# Loaded automatically when SPRING_PROFILES_ACTIVE=docker (already set in
# docker-compose.yml).
#
# IMPORTANT: Spring Boot's relaxed binder does NOT merge indexed list
# properties (like spring.cloud.gateway.server.webmvc.routes[N]) across
# multiple property sources. Whichever source "wins" for that property root
# (this profile-specific file, since it has higher priority) becomes the
# ENTIRE source of truth for the whole list. If only some indices are
# defined here, the resulting list has gaps and fails to bind — even if
# every field on those specific indices is complete and correct.
#
# Fix: the FULL route list (all indices, 0-3) must be repeated here,
# not just the ones whose uri changes. routes[0] and routes[1] are
# identical to the base file; only routes[2]/[3].uri actually differ.
# --------------------------------------------------------------------------

# Eureka: use the container name instead of localhost
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# product-service route - unchanged from base, repeated for contiguous indices
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/product/**

# order-service route - unchanged from base, repeated for contiguous indices
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/order/**

# discovery-service route - full definition repeated (uri changed to container name)
spring.cloud.gateway.server.webmvc.routes[2].id=discovery-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://discovery-server:8761
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=SetPath=/

# discovery-assets route - full definition repeated (uri changed to container name)
spring.cloud.gateway.server.webmvc.routes[3].id=discovery-assets
spring.cloud.gateway.server.webmvc.routes[3].uri=http://discovery-server:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/**

# Keycloak issuer: container name + correct port (8080, not 8180)
# NOTE: realm name corrected to match the realm actually created in Keycloak
# (Microservice-realm), not the placeholder "spring-boot-micro" used before.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/microservice-realm

# Zipkin: container name + real internal port (9411, not the host-mapped 19411)
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans