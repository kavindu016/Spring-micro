apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: spring-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: kavindu20/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: spring-micro
spec:
  selector:
    app: api-gateway
  ports:
    - port: 9090
      targetPort: 9090