# --------------------------------------------------------------------------
# Docker-profile overrides for inventory-service
# Loaded automatically when SPRING_PROFILES_ACTIVE=docker (already set in
# docker-compose.yml). Only properties that differ from application.properties
# need to appear here.
# --------------------------------------------------------------------------

# MySQL: use the container name instead of localhost.
# Requires a dedicated MySQL container in docker-compose.yml (see below) —
# the existing postgres-inventory container is NOT used for this service.
spring.datasource.url=jdbc:mysql://mysql-inventory:3306/inventory_service?createDatabaseIfNotExist=true

# Eureka: use the container name instead of localhost
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# Zipkin: container name + real internal port (9411, not the host-mapped 19411)
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans