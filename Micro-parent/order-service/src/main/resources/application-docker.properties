# --------------------------------------------------------------------------
# Docker-profile overrides for order-service
# --------------------------------------------------------------------------

# MySQL: use the container name instead of localhost.
# Requires a dedicated mysql-order container in docker-compose.yml.
spring.datasource.url=jdbc:mysql://mysql-order:3306/order_service?createDatabaseIfNotExist=true

# Eureka: container name instead of localhost
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# Zipkin: container name + real internal port (9411, not host-mapped 19411)
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans

# Kafka: use the INTERNAL listener (kafka:29092), not the host listener (9092)
spring.kafka.bootstrap-servers=kafka:29092